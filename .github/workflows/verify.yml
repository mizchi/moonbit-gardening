name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm test
      - run: node --check scripts/refresh.mjs
      - run: node --check scripts/render.mjs
      - run: node --check scripts/verify.mjs
